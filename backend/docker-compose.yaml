version: '3.8'

services:
  backend:
    # Use the pre-built image from Docker Hub instead of building locally.
    # Pushed by .github/workflows/docker-publish.yml on push to main / tags v*.
    # To re-enable local build, add back a `build:` block and remove this `image:` line.
    image: jacyli/dns-mng:backend
    container_name: dns-mng-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_URL=${DB_URL}
      - DB_AUTH_TOKEN=${DB_AUTH_TOKEN}
      - DB_PATH=${DB_PATH:-/data/dns-mng.db}
      - JWT_SECRET=${JWT_SECRET:-dns-mng-secret-key-change-in-production}
    volumes:
      - dns-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8080/api/providers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  dns-data:
    driver: local
